# Buscas do Hermes. Cada item vira uma chamada por fonte; "defaults" vale para todas.
# Mantenha poucas buscas e results_wanted baixo: volume alto é o que faz o LinkedIn
# bloquear o IP de casa.
#
# sites: linkedin | indeed | gupy
# job_type (só JobSpy): fulltime | parttime | internship | contract  (vazio = qualquer)
# gupy_term / gupy_state: sobrescrevem term / estado só na Gupy, cuja busca por
#   nome é bem mais literal que a do LinkedIn.
# O nível (estágio/júnior) não é filtrado na busca — o LinkedIn marca errado com
# frequência. Quem decide é o pré-filtro abaixo e a nota do LLM.

defaults:
  location: "São Paulo, Brasil"
  sites: [linkedin, gupy]
  # Janela curta de propósito: o modo canal não guarda nada em disco, então depois de
  # um restart repete no máximo o que saiu nessas horas. Deixe perto do intervalo
  # entre buscas (HERMES_SEARCH_EVERY_HOURS) mais uma folga.
  hours_old: 3
  results_wanted: 15

searches:
  - name: estagio-dev
    term: "estágio desenvolvedor"
    gupy_term: "estágio"

  - name: estagio-ti
    term: "estágio TI"
    sites: [linkedin]

  - name: junior-dev
    term: "desenvolvedor júnior"
    gupy_term: "desenvolvedor"

# Descarte certo pelo título ou tipo, antes de gastar token. Na dúvida, não coloque
# aqui: o LLM decide melhor. Comparação sem acento e por palavra inteira.
filtros:
  excluir_no_titulo:
    - sênior
    - senior
    - sr
    - pleno
    - especialista
    - lead
    - líder
    - tech lead
    - coordenador
    - coordenadora
    - gerente
    - manager
    - talent community
    - banco de talentos
  # "mid-senior level" NÃO entra: o LinkedIn marca vaga júnior assim com frequência.
  excluir_niveis:
    - talent_pool
    - director
    - executive

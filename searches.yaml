# Buscas do Hermes. Cada item vira uma chamada por fonte; "defaults" vale para todas.
# Mantenha poucas buscas e results_wanted baixo: volume alto é o que faz o LinkedIn
# bloquear o IP de casa.
#
# sites: linkedin | indeed | gupy
# job_type (só JobSpy): fulltime | parttime | internship | contract  (vazio = qualquer)
# gupy_term / gupy_state: sobrescrevem term / estado só na Gupy, cuja busca por
#   nome é bem mais literal que a do LinkedIn.
# O nível (estágio/júnior) não é filtrado na busca — o LinkedIn marca errado com
# frequência. Quem decide é o pré-filtro abaixo e a nota do LLM.

defaults:
  location: "São Paulo, Brasil"
  sites: [linkedin, gupy]
  # Janela curta de propósito: o modo canal não guarda nada em disco, então depois de
  # um restart repete no máximo o que saiu nessas horas. Deixe perto do intervalo
  # entre buscas (HERMES_SEARCH_EVERY_HOURS) mais uma folga.
  hours_old: 3
  results_wanted: 15

searches:
  - name: estagio-dev
    term: "estágio desenvolvedor"
    gupy_term: "estágio"

  - name: estagio-ti
    term: "estágio TI"
    sites: [linkedin]

  - name: junior-dev
    term: "desenvolvedor júnior"
    gupy_term: "desenvolvedor"

# Descarte certo pelo título ou tipo, antes de gastar token. Na dúvida, não coloque
# aqui: o LLM decide melhor. Comparação sem acento e por palavra inteira.
filtros:
  excluir_no_titulo:
    - sênior
    - senior
    - sr
    # "pleno" saiu daqui: tem thread própria no Discord (discord.threads abaixo).
    - especialista
    - lead
    - líder
    - tech lead
    - coordenador
    - coordenadora
    - supervisor
    - supervisora
    - gerente
    - manager
    - talent community
    - banco de talentos
  # "mid-senior level" NÃO entra: o LinkedIn marca vaga júnior assim com frequência.
  excluir_niveis:
    - talent_pool
    - director
    - executive

# Modo canal: em qual thread do Discord cai cada nível. As threads precisam ser do
# canal do webhook. ID = botão direito na thread > Copiar ID (modo desenvolvedor).
# Níveis: estagio, aprendiz, trainee, junior, pleno, senior. Vaga sem nível
# reconhecido ou sem thread aqui vai para "outros"; sem "outros", vai para onde a
# URL do webhook aponta. O nível vem do título, do tipo da vaga ou da descrição
# (hermes/filters.py) e aparece no rodapé do card, com o motivo.
# Sênior pelo título continua descartado (excluir_no_titulo); a thread "senior"
# recebe as que só a descrição mostra que são sênior. Aprendiz cai em "outros".
discord:
  threads:
    estagio: 1565855671717470408  # Vagas de Estágio
    junior: 1565863374980513822   # Vagas de Júnior
    pleno: 1565863605100871740    # Vagas de Pleno
    trainee: 1565864076721000589  # Vagas de Trainee
    senior: 1565863971037253753   # Vagas de Sênior
    outros: 1565864173051580496   # Outras Vagas
